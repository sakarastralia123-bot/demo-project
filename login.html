<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Verdana, sans-serif;
            min-height: 100vh;
            background: #e8eef7;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 750px;
            min-height: 420px;
            background: white;
            display: flex;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .welcome {
            width: 45%;
            background: #1d3557;
            color: white;
            padding: 50px 30px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .welcome p {
            line-height: 1.6;
            font-size: 15px;
        }

        .login {
            width: 55%;
            padding: 45px;
        }

        .login h2 {
            margin-bottom: 30px;
            color: #1d3557;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            margin-bottom: 20px;
            border-radius: 3px;
            outline: none;
        }

        input:focus {
            border-color: #1d3557;
        }

        .login button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #1d3557;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 3px;
        }

        .login button:hover {
            background: #457b9d;
        }

        .forgot {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #457b9d;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .container {
                width: 90%;
                flex-direction: column;
            }

            .welcome,
            .login {
                width: 100%;
            }

            .welcome {
                padding: 30px;
            }

            .login {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="welcome">
            <h1>Welcome Back!</h1>

            <p>
                Login to your account and continue
                using our website. We are happy
                to have you here.
            </p>
        </div>

        <div class="login">

            <h2>Sign In</h2>

            <form>

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Sign In</button>

            </form>

        </div>

    </div>

</body>
</html>
