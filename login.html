<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
        }

        header {
            width: 100%;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            color: #00e5ff;
        }

        .main {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 8%;
        }

        .content {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .welcome {
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .welcome h1 span {
            color: #00e5ff;
        }

        .welcome p {
            line-height: 1.7;
            color: #d7e3ea;
            max-width: 450px;
        }

        .welcome button {
            width: 160px;
            margin-top: 30px;
            padding: 13px;
            border: none;
            border-radius: 25px;
            background: #00e5ff;
            color: #102027;
            font-weight: bold;
            cursor: pointer;
        }

        .welcome button:hover {
            background: white;
        }

        .form-section {
            background: white;
            color: #222;
            padding: 45px;
            min-height: 500px;
        }

        .tabs {
            display: flex;
            margin-bottom: 35px;
            border-bottom: 1px solid #ddd;
        }

        .tabs button {
            flex: 1;
            padding: 15px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
        }

        .tabs button.active {
            color: #008fa3;
            border-bottom: 3px solid #00bcd4;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form h2 {
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #00bcd4;
            box-shadow: 0 0 5px rgba(0, 188, 212, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #00a6bd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #008fa3;
        }

        .forgot {
            display: block;
            text-align: right;
            margin: 10px 0 20px;
            color: #008fa3;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            .content {
                grid-template-columns: 1fr;
            }

            .welcome {
                padding: 40px;
            }

            .welcome h1 {
                font-size: 38px;
            }

            .form-section {
                padding: 35px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">MyPortal</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="main">

        <div class="content">

            <section class="welcome">
                <h1>Welcome to <span>MyPortal</span></h1>

                <p>
                    Access your account, manage your profile,
                    and explore everything our platform has to offer.
                    Create an account today or sign in to continue.
                </p>

                <button onclick="showSignup()">Get Started</button>
            </section>


            <section class="form-section">

                <div class="tabs">
                    <button id="loginTab"
                            class="active"
                            onclick="showLogin()">
                        Login
                    </button>

                    <button id="signupTab"
                            onclick="showSignup()">
                        Sign Up
                    </button>
                </div>


                <!-- LOGIN FORM -->

                <form id="loginForm"
                      class="form active"
                      action="/login"
                      method="POST">

                    <h2>Welcome Back</h2>

                    <div class="input-group">
                        <label for="loginEmail">Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">Password</label>
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required>
                    </div>

                    <a href="#" class="forgot">
                        Forgot Password?
                    </a>

                    <button type="submit" class="submit-btn">
                        Login
                    </button>

                </form>


                <!-- SIGN UP FORM -->

                <form id="signupForm"
                      class="form"
                      action="/signup"
                      method="POST">

                    <h2>Create Account</h2>

                    <div class="input-group">
                        <label for="fullName">Full Name</label>
                        <input
                            type="text"
                            id="fullName"
                            name="fullname"
                            placeholder="Enter your full name"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="signupEmail">Email</label>
                        <input
                            type="email"
                            id="signupEmail"
                            name="email"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="signupPassword">Password</label>
                        <input
                            type="password"
                            id="signupPassword"
                            name="password"
                            placeholder="Create a password"
                            required>
                    </div>

                    <button type="submit" class="submit-btn">
                        Create Account
                    </button>

                </form>

            </section>

        </div>

    </main>


    <script>

        function showLogin() {

            document.getElementById("loginForm")
                .classList.add("active");

            document.getElementById("signupForm")
                .classList.remove("active");

            document.getElementById("loginTab")
                .classList.add("active");

            document.getElementById("signupTab")
                .classList.remove("active");
        }


        function showSignup() {

            document.getElementById("signupForm")
                .classList.add("active");

            document.getElementById("loginForm")
                .classList.remove("active");

            document.getElementById("signupTab")
                .classList.add("active");

            document.getElementById("loginTab")
                .classList.remove("active");
        }

    </script>

</body>
</html>
